server:
  port: ${SERVER_PORT:8084}
spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/payment_db}
    username: ${SPRING_DATASOURCE_USERNAME:payment_app}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    hikari:
      maximum-pool-size: 5
      connection-timeout: 10000
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
management:
  endpoints:
    web:
      exposure:
        include: health,info
app:
  role: ${APP_ROLE:api}
  public-url: ${PUBLIC_API_BASE_URL:http://localhost:8084}
  cors: ${CORS_ALLOWED_ORIGINS:http://localhost:5500,http://127.0.0.1:5500}
  poll-ms: ${WORKER_POLL_MS:2000}
