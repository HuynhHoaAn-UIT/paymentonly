name: shopsphere-qr-demo
services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: payment_db
      MYSQL_USER: payment_app
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - payment_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [payment-net]
  payment-api:
    build: ./payment
    image: shopsphere/qr-payment:local
    environment: &payment_env
      APP_ROLE: api
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/payment_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: payment_app
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD}
      PUBLIC_API_BASE_URL: ${PUBLIC_API_BASE_URL:-http://localhost:8084}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5500,http://127.0.0.1:5500}
    ports: ["8084:8084"]
    depends_on:
      mysql: {condition: service_healthy}
    networks: [payment-net]
    restart: unless-stopped
  payment-worker:
    image: shopsphere/qr-payment:local
    environment:
      <<: *payment_env
      APP_ROLE: worker
    depends_on:
      mysql: {condition: service_healthy}
      payment-api: {condition: service_started}
    networks: [payment-net]
    restart: unless-stopped
volumes:
  payment_mysql_data:
networks:
  payment-net:
