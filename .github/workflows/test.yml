name: Java tests and Docker build
on:
  push:
    branches: [main, "feature/**"]
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: payment/pom.xml
      - run: mvn -B -f payment/pom.xml test
      - run: docker build -t shopsphere/qr-payment:ci ./payment
